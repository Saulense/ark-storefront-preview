name: Publish reviewed ARK preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ark-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the exact selected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify immutable public payload and extract
        run: node verify-release.mjs
      - name: Apply reviewed responsive homepage refinements
        run: node apply-home72.mjs
      - name: Apply reviewed ARK Hack design refinements
        run: node apply-hack73.mjs
      - name: Apply reviewed stacked ARK Hack pack rows
        run: node apply-hack75.mjs
      - name: Apply reviewed shared trust and recommendation sections
        run: node apply-sections76.mjs
      - name: Apply reviewed ARK Hack Refills design
        run: node apply-refills77.mjs
      - name: Apply reviewed Sacred Pair refinements
        run: node apply-sacred78.mjs
      - name: Apply reviewed matching product section refinements
        run: node apply-products79.mjs
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload verified site only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
