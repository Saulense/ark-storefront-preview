name: Publish reviewed ARK preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ark-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the exact selected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify immutable public payload and extract
        run: node verify-release.mjs
      - name: Apply reviewed responsive homepage refinements
        run: node apply-home72.mjs
      - name: Apply reviewed ARK Hack design refinements
        run: node apply-hack73.mjs
      - name: Apply reviewed stacked ARK Hack pack rows
        run: node apply-hack75.mjs
      - name: Apply reviewed shared trust and recommendation sections
        run: node apply-sections76.mjs
      - name: Apply reviewed ARK Hack Refills design
        run: node apply-refills77.mjs
      - name: Apply reviewed Sacred Pair refinements
        run: node apply-sacred78.mjs
      - name: Apply reviewed matching product section refinements
        run: node apply-products79.mjs
      - name: Apply reviewed homepage caption contrast
        run: node apply-home80.mjs
      - name: Apply reviewed shared footer carousel controls
        run: node apply-footer81.mjs
      - name: Apply reviewed Nasal Strips palette refinements
        run: node apply-nasal82.mjs
      - name: Apply reviewed Drops and Hack bundle design
        run: node apply-bundle83.mjs
      - name: Apply reviewed Shop and recommendation cards
        run: node apply-cards84.mjs
      - name: Apply reviewed top-aligned square Hack benefit photos
        run: node apply-square85.mjs
      - name: Apply reviewed Breathworks layout and original reveal behavior
        run: node apply-breathwork86.mjs
      - name: Apply reviewed premium editorial pages and compact bundle cards
        run: node apply-premium87.mjs
      - name: Apply reviewed source-matched NeuroFuel kit builder and sections
        run: node apply-neurofuel89.mjs
      - name: Apply reviewed uncropped Breathworks hero and matching CTA
        run: node apply-breathwork90.mjs
      - name: Apply reviewed compact subscription refill supply bubbles
        run: node apply-refill91.mjs
      - name: Apply reviewed Mouth Tape lifestyle image and text
        run: node apply-mouth92.mjs
      - name: Apply reviewed complete NeuroFuel visual flow and motion
        run: node apply-neurofuel93.mjs
      - name: Apply Extra Strong ritual and comparison polish
        run: node apply-melts99.mjs
      - name: Apply shared billing selector focus repair
        run: node apply-billing100.mjs
      - name: Remove billing interaction frames
        run: node apply-billing101.mjs
      - name: Apply shared product cards and horizontal navigation arrows
        run: node apply-home111.mjs
      - name: Match collection caption gradient to dark-green brand strip
        run: node apply-caption112.mjs
      - name: Use horizontal email signup arrows
        run: node apply-email-arrows113.mjs
      - name: Preserve excluded footer and add View all spacing
        run: node apply-spacing114.mjs
      - name: Clip mobile review slider at screen edges
        run: node apply-reviews115.mjs
      - name: Apply shared galleries and purchase presentation
        run: node apply-shared117.mjs
      - name: Apply shared purchase alignment and review snapshots
        run: node apply-shared118.mjs
      - name: Apply consistent gallery spacing and image variant selectors
        run: node apply-shared119.mjs
      - name: Apply reviewed first-paint layout and dynamic subscription badges
        run: node apply-shared120.mjs
      - name: Apply shared selector sizing, badge spacing and information dismissal
        run: node apply-shared121.mjs
      - name: Apply live Shop styling and authentic shared review cards
        run: node apply-shared122.mjs
      - name: Limit Explore review links to the approved migration pages
