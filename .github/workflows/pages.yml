        run: node apply-joins146.mjs
      - name: Use bag-only Nasal Strips pack photographs for both colours
        run: node apply-pack147.mjs
      - name: Use matching bag-only Power Sleep Bundle photographs for both colours
        run: node apply-pack148.mjs
      - name: Show image flavour choices and item rows for Drops Hack Bundle
        run: node apply-bundle149.mjs
      - name: Extend Sacred Pair mobile timeline clipping to screen edges
