      - name: Apply reviewed simple NeuroFuel kit purchase preview
        run: node apply-neurofuel132.mjs
      - name: Apply reviewed selected-package owner photographs
        run: node apply-packshots133.mjs
      - name: Restore the reviewed Shop savings heading highlight
        run: node apply-heading134.mjs
      - name: Match reviewed Shop content width to the live reference
        run: node apply-width135.mjs
      - name: Apply repaired reviewed shared sections and review refinements
        run: node apply-sections137.mjs
      - name: Apply reviewed full-name Drops ingredient lists
