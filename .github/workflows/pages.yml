        run: node apply-bundle155.mjs
      - name: Apply Performance Pack palette and spacing 156
        run: node apply-performance156.mjs
      - name: Apply reviewed NeuroFuel and review-heading polish157
        run: node apply-neurofuel157.mjs
      - name: Tighten reviewed NeuroFuel mobile media gap158
        run: node apply-gap158.mjs
      - name: Apply reviewed mobile video rhythm and Lemon text159
        run: node apply-polish159.mjs
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload verified site only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
